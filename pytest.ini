[pytest]
minversion = 7.0
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q --strict-markers
markers =
    unit: Pure unit tests requiring no external database or network.
    api: FastAPI endpoint contract and validation tests.
    integration: Database integration tests requiring active XAMPP MySQL.
filterwarnings =
    ignore::DeprecationWarning

